name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update ditto formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          ARM64_SHA="${{ github.event.client_payload.arm64_sha }}"
          X86_64_SHA="${{ github.event.client_payload.x86_64_sha }}"

          cat > Formula/ditto.rb << RUBY
          class Ditto < Formula
            desc "A dotfile manager that transforms your dev environment"
            homepage "https://github.com/pattynextdoor/ditto"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/pattynextdoor/ditto/releases/download/v${VERSION}/ditto-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM64_SHA}"
              else
                url "https://github.com/pattynextdoor/ditto/releases/download/v${VERSION}/ditto-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_SHA}"
              end
            end

            def install
              bin.install "ditto"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ditto --version")
            end
          end
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ditto.rb
          git commit -m "Update ditto to ${{ github.event.client_payload.version }}"
          git push
